name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/server.cjs doctor
      - run: node dist/server.cjs models recipes
      # API-02: a suíte de compatibilidade sobe o servidor e conversa com ele por HTTP
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: dist/server.cjs

  release:
    # REL-01: pacote portátil por sistema (sem o Node embutido; o lançador baixa na primeira vez)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node packaging/build-release.mjs --platform all
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-portateis
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
