- id: flux2-klein-4b
  name: FLUX.2 klein 4B
  kind: image
  engine: sdcpp
  family: flux2
  status: draft
  license: apache-2.0
  minVramMiB: 6000
  match: { repos: [black-forest-labs/FLUX.2-klein-4B, leejet/FLUX.2-klein-4B-GGUF, unsloth/FLUX.2-klein-4B-GGUF, ponpoke/flux2-klein-4b-uncensored-text-encoder] }
  files:
    - { role: diffusion, slot: diffusion, from: { repo: unsloth/FLUX.2-klein-4B-GGUF, pattern: "*{quant}.gguf", prefer: [Q4_K_M, Q4_K_S, Q5_K_M, Q6_K, Q8_0, Q3_K_M], alternatives: [{ repo: leejet/FLUX.2-klein-4B-GGUF, pattern: "*{quant}.gguf", prefer: [Q4_K_M, Q4_0, Q5_0, Q8_0] }, { repo: black-forest-labs/FLUX.2-klein-4B, path: flux-2-klein-4b.safetensors }] } }
    - { role: vae, slot: vae, subdir: encoders/flux2, from: { repo: Comfy-Org/flux2-klein-4B, glob: "split_files/vae/*.safetensors", alternatives: [{ repo: black-forest-labs/FLUX.2-dev, path: ae.safetensors }] } }
