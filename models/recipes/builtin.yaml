- id: krea-2-turbo
  name: Krea 2 Turbo (12B)
  kind: image
  engine: python:diffusers
  status: planned
  license: krea-2-license
  gated: true
  minVramMiB: 16000
  match: { repos: [krea/Krea-2-Turbo, krea/Krea-2-Raw, lvladikov/Krea2-Turbo-Distill-4step-LoRA, vantagewithai/Krea-2-Turbo-GGUF] }
  files:
    - { role: diffusion, slot: diffusion, from: { repo: vantagewithai/Krea-2-Turbo-GGUF, pattern: "krea2_turbo-{quant}.gguf", prefer: [Q4_K_M, Q4_0, Q5_K_M, Q6_K, Q8_0, Q3_K_M], alternatives: [{ repo: krea/Krea-2-Turbo, path: turbo.safetensors }] } }
    - { role: vae, slot: vae, subdir: encoders/krea2, from: { repo: krea/Krea-2-Turbo, path: vae/diffusion_pytorch_model.safetensors } }
    - { role: text_encoder, slot: llm, subdir: encoders/krea2, from: { repo: krea/Krea-2-Turbo, path: text_encoder/model.safetensors } }
  notes:
    - "stable-diffusion.cpp ainda não suporta a arquitetura Krea 2 (issue #1703); quando suportar, esta receita já aponta para o GGUF comunitário (vantagewithai) e vira engine: sdcpp."
    - "VAE e text encoder (Qwen3-VL 4B) só existem no repositório gated da Krea: precisa de token."
    - "A LoRA lvladikov/Krea2-Turbo-Distill-4step-LoRA depende deste modelo."
  sources: [https://github.com/leejet/stable-diffusion.cpp/issues/1703]

# ───────────────────────────── Vídeo (stable-diffusion.cpp vid_gen) ─────────────────────────────
- id: wan2.2-ti2v-5b
  name: Wan 2.2 TI2V 5B
  kind: video
  engine: sdcpp
  family: wan
  status: draft
  license: apache-2.0
  minVramMiB: 6000
  match: { repos: [Wan-AI/Wan2.2-TI2V-5B, Comfy-Org/Wan_2.2_ComfyUI_Repackaged] }
  files:
    - { role: diffusion, slot: diffusion, from: { repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors } }
    - { role: vae, slot: vae, subdir: encoders/wan, from: { repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/vae/wan2.2_vae.safetensors } }
    - { role: text_encoder, slot: t5xxl, subdir: encoders/wan, from: { repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged, path: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors } }
