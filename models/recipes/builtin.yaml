# Receitas embutidas do AI Studio.
# Uma receita = todos os arquivos (de um ou vários repositórios) + como o motor os usa.
# status: verified (testado no Studio) | community (arquivos confirmados, motor ainda não testado aqui)
#         | draft (caminhos por glob, confirmar ao instalar) | planned (motor ainda não existe no Studio)
# Os caminhos com {quant} são resolvidos consultando a árvore real do repositório; o primeiro da
# lista `prefer` que existir e couber na VRAM é escolhido. Globs também são validados na hora.

recipes:

# ───────────────────────────── OCR (llama.cpp + mmproj) ─────────────────────────────
- id: glm-ocr
  name: GLM-OCR (0.9B)
  kind: ocr
  engine: llamacpp
  status: community
  description: OCR de documentos com layout, tabelas, fórmulas e extração por JSON schema. MIT.
  license: mit
  minVramMiB: 2500
  match: { repos: [zai-org/GLM-OCR, ggml-org/GLM-OCR-GGUF] }
  files:
    - { role: main, slot: model, from: { repo: ggml-org/GLM-OCR-GGUF, pattern: "GLM-OCR-{quant}.gguf", prefer: [Q8_0, f16] } }
    - { role: mmproj, slot: mmproj, kind: ocr, from: { repo: ggml-org/GLM-OCR-GGUF, glob: "mmproj-GLM-OCR-*.gguf" } }
  engineArgs:
    llamacpp: ["-m", "{model}", "--mmproj", "{mmproj}", "-c", "12000", "-ngl", "99", "--flash-attn", "off"]
  sources:
    - https://huggingface.co/zai-org/GLM-OCR
    - https://github.com/ggml-org/llama.cpp/discussions/19721

- id: unlimited-ocr
  name: Unlimited-OCR (Baidu)
  kind: ocr
  engine: llamacpp
  status: community
  description: OCR multimodal da Baidu em GGUF comunitário; conferir qualidade em PT-BR.
  license: mit
  minVramMiB: 3500
  match: { repos: [baidu/Unlimited-OCR, sabafallah/Unlimited-OCR-GGUF, sahilchachra/Unlimited-OCR-GGUF] }
  files:
    - { role: main, slot: model, from: { repo: sabafallah/Unlimited-OCR-GGUF, pattern: "unlimited-ocr-{quant}.gguf", prefer: [Q4_K_M, q8_0, bf16] } }
    - { role: mmproj, slot: mmproj, kind: ocr, from: { repo: sabafallah/Unlimited-OCR-GGUF, glob: "mmproj-unlimited-ocr-q8_0.gguf" } }
  engineArgs:
    llamacpp: ["-m", "{model}", "--mmproj", "{mmproj}", "-c", "8192", "-ngl", "99"]
  notes: ["Se a arquitetura não carregar no llama-server bundled, atualizar a release do llama.cpp (tarefa ENG-01)."]
  sources: [https://huggingface.co/baidu/Unlimited-OCR, https://huggingface.co/blog/ggml-org/using-ocr-models-with-llama-cpp]

- id: falcon-ocr
  name: Falcon-OCR (TII)
  kind: ocr
  engine: python:transformers
  status: planned
  description: Sem GGUF disponível em set/2026; roda pelo motor Python (venv) quando ele existir.
  license: apache-2.0
  match: { repos: [tiiuae/Falcon-OCR] }
  files:
    - { role: main, slot: model, from: { repo: tiiuae/Falcon-OCR, path: model.safetensors } }
    - { role: config, slot: config, from: { repo: tiiuae/Falcon-OCR, glob: "*.json" } }
  notes: ["Quando surgir um derivado GGUF (filtro base_model:quantized), trocar engine para llamacpp."]

# ───────────────────────────── Imagem (stable-diffusion.cpp) ─────────────────────────────
- id: sdxl-base-1.0
  name: Stable Diffusion XL base 1.0
  kind: image
  engine: sdcpp
  family: sdxl
  status: community
  license: openrail++
  minVramMiB: 4500
  match: { repos: [stabilityai/stable-diffusion-xl-base-1.0] }
  files:
    - { role: main, slot: model, from: { repo: stabilityai/stable-diffusion-xl-base-1.0, path: sd_xl_base_1.0.safetensors } }
  engineArgs:
    sdcpp: ["-m", "{model}", "--cfg-scale", "7.0", "--steps", "25", "-W", "1024", "-H", "1024"]

- id: animagine-xl-4.0
  name: Animagine XL 4.0
  kind: image
  engine: sdcpp
  family: sdxl
  status: community
  license: openrail++
  minVramMiB: 4500
  match: { repos: [cagliostrolab/animagine-xl-4.0] }
  files:
    - { role: main, slot: model, from: { repo: cagliostrolab/animagine-xl-4.0, path: animagine-xl-4.0-opt.safetensors } }
  engineArgs:
    sdcpp: ["-m", "{model}", "--cfg-scale", "5.0", "--steps", "28", "-W", "1024", "-H", "1024"]

- id: sd3.5-medium
  name: Stable Diffusion 3.5 Medium
  kind: image
  engine: sdcpp
  family: sd3
  status: community
  license: stabilityai-community
  gated: true
  minVramMiB: 5500
  match: { repos: [stabilityai/stable-diffusion-3.5-medium, city96/stable-diffusion-3.5-medium-gguf, Comfy-Org/stable-diffusion-3.5-fp8] }
  files:
    - { role: diffusion, slot: model, from: { repo: city96/stable-diffusion-3.5-medium-gguf, pattern: "sd3.5_medium-{quant}.gguf", prefer: [Q8_0, Q6_K, Q5_K_M, Q4_K_M, Q4_0, F16], alternatives: [{ repo: stabilityai/stable-diffusion-3.5-medium, path: sd3.5_medium.safetensors }] } }
    - { role: text_encoder, slot: clip_l, subdir: encoders, from: { repo: Comfy-Org/stable-diffusion-3.5-fp8, path: text_encoders/clip_l.safetensors, alternatives: [{ repo: comfyanonymous/flux_text_encoders, path: clip_l.safetensors }] } }
    - { role: text_encoder, slot: clip_g, subdir: encoders, from: { repo: Comfy-Org/stable-diffusion-3.5-fp8, path: text_encoders/clip_g.safetensors, alternatives: [{ repo: stabilityai/stable-diffusion-3.5-medium, path: text_encoders/clip_g.safetensors }] } }
    - { role: text_encoder, slot: t5xxl, subdir: encoders, from: { repo: Comfy-Org/stable-diffusion-3.5-fp8, path: text_encoders/t5xxl_fp8_e4m3fn.safetensors, alternatives: [{ repo: comfyanonymous/flux_text_encoders, path: t5xxl_fp8_e4m3fn.safetensors }] } }
  engineArgs:
    sdcpp: ["--diffusion-model", "{model}", "--clip_l", "{clip_l}", "--clip_g", "{clip_g}", "--t5xxl", "{t5xxl}", "--cfg-scale", "4.5", "--steps", "28", "--sampling-method", "euler", "-W", "1024", "-H", "1024", "--offload-to-cpu"]
  notes: ["Os pesos originais da Stability são gated; a receita usa o GGUF da city96 e os encoders do repack da Comfy-Org, ambos abertos. Com token HF, o original vira alternativa."]
  sources: [https://github.com/leejet/stable-diffusion.cpp/blob/master/docs/sd3.md]

- id: flux1-dev
  name: FLUX.1 dev (GGUF)
  kind: image
  engine: sdcpp
  family: flux1
  status: community
  license: flux-1-dev-non-commercial-license
  nonCommercial: true
  minVramMiB: 6000
  match: { repos: [black-forest-labs/FLUX.1-dev, city96/FLUX.1-dev-gguf, leejet/FLUX.1-dev-gguf, unsloth/FLUX.1-dev-GGUF] }
  files:
    - { role: diffusion, slot: diffusion, from: { repo: city96/FLUX.1-dev-gguf, pattern: "flux1-dev-{quant}.gguf", prefer: [Q4_K_S, Q4_0, Q5_K_S, Q5_0, Q6_K, Q8_0, Q3_K_S, F16] } }
    - { role: vae, slot: vae, subdir: encoders/flux, from: { repo: Comfy-Org/z_image_turbo, path: split_files/vae/ae.safetensors, alternatives: [{ repo: Comfy-Org/Lumina_Image_2.0_Repackaged, path: split_files/vae/ae.safetensors }, { repo: black-forest-labs/FLUX.1-schnell, path: ae.safetensors }] } }
    - { role: text_encoder, slot: clip_l, subdir: encoders, from: { repo: comfyanonymous/flux_text_encoders, path: clip_l.safetensors } }
    - { role: text_encoder, slot: t5xxl, subdir: encoders, from: { repo: comfyanonymous/flux_text_encoders, path: t5xxl_fp8_e4m3fn.safetensors } }
  engineArgs:
    sdcpp: ["--diffusion-model", "{diffusion}", "--vae", "{vae}", "--clip_l", "{clip_l}", "--t5xxl", "{t5xxl}", "--cfg-scale", "1.0", "--steps", "20", "--sampling-method", "euler", "--offload-to-cpu", "--diffusion-fa"]
  notes: ["Os pesos originais (23,8 GB fp16) são gated; a receita usa o GGUF quantizado da city96, que não é.", "VAE (ae.safetensors, idêntico ao do FLUX) vem do repack aberto da Comfy-Org; o FLUX.1-schnell virou gated em 2026."]
  sources: [https://github.com/leejet/stable-diffusion.cpp/blob/master/docs/flux.md]

- id: flux1-schnell
  name: FLUX.1 schnell (GGUF)
